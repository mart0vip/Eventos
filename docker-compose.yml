services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos_dev
    ports:
      - "5433:5432"
    volumes:
      - eventos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventos_postgres_data:
